<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Spung Gods</title><style>*{box-sizing:border-box}body{margin:0;background:#052934;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}main{position:relative;width:min(100%,1000px);height:100dvh;margin:auto;overflow:hidden;background:#17bfc9}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}.pill,button{border:2px solid #fff7;border-radius:16px;background:#064854e8;padding:10px 13px;color:white;font-weight:800}button{cursor:pointer;touch-action:manipulation}button:active{transform:scale(.94)}.hud button{pointer-events:auto;margin-left:auto}.brand{color:#ffeb64}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#053b4b70;backdrop-filter:blur(4px)}.card{width:min(88%,420px);text-align:center;background:#073e4cef;border:3px solid #95eff0;border-radius:28px;padding:26px;box-shadow:0 15px 70px #002b48a0}h1{font-size:clamp(36px,8vw,60px);line-height:.95;color:#fff06a;margin:4px 0 20px;text-shadow:3px 4px #a55e21}p{line-height:1.6;color:#d5faff}.start{background:#ffe16a;color:#553916;font-size:20px;border-color:#fff7a0;width:100%}.controls{position:absolute;bottom:max(15px,env(safe-area-inset-bottom));left:12px;right:12px;display:flex;gap:9px;justify-content:center}.controls button{background:#075663cf;font-size:23px;min-height:58px;flex:1;max-width:110px}.hidden{display:none!important}.toast{position:absolute;top:80px;width:100%;text-align:center;color:#fff18c;font-weight:900;font-size:21px;pointer-events:none}</style><main><canvas id="game"></canvas><div class="hud"><span class="pill brand">SPUNG GODS</span><span class="pill" id="stats">0 m · 🪙 0</span><button id="pause" aria-label="Pause">Ⅱ</button><button id="sound" aria-label="Toggle sound">♪ OFF</button></div><div class="toast" id="toast"></div><div class="controls"><button data-action="left" aria-label="Move left">◀</button><button data-action="jump" aria-label="Jump">↥</button><button data-action="slide" aria-label="Slide">↧</button><button data-action="right" aria-label="Move right">▶</button></div><div class="overlay" id="overlay"><div class="card"><h1>SPUNG<br>GODS</h1><p id="message">A bubbly three-lane seabed sprint!<br>Jump coral • Slide under jelly gates<br>Dodge crates • Grab golden shells</p><button class="start" id="start">START RUN</button><p style="font-size:13px;margin-bottom:0">Swipe or use buttons. Keyboard: ← → / ↑ jump / ↓ slide / P pause.<br>Yellow glow = shield · Pink shell = magnet</p><p id="best" style="font-size:13px"></p></div></div></main><script>
'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),stats=document.getElementById('stats'),message=document.getElementById('message'),start=document.getElementById('start'),toast=document.getElementById('toast');let W=0,H=0,dpr=1,mode='ready',lane=0,laneX=0,jump=0,vy=0,slide=0,dist=0,coins=0,hp=3,speed=23,spawn=0,items=[],particles=[],shield=0,magnet=0,inv=0,clock=0,last=0,best=0,audio=null,sound=false,toastTime=0;try{best=+localStorage.getItem('spungGodsBest')||0}catch{}document.getElementById('best').textContent='BEST '+best+' m';function resize(){W=canvas.clientWidth;H=canvas.clientHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();function beep(f=600){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=f;g.gain.setValueAtTime(.05,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.start();o.stop(audio.currentTime+.14)}catch{}}function say(t){toast.textContent=t;toastTime=2}function begin(){lane=laneX=jump=vy=slide=dist=coins=spawn=shield=magnet=inv=0;hp=3;speed=23;items=[];particles=[];mode='run';overlay.classList.add('hidden');beep(500)}start.onclick=()=>{if(mode==='paused'){mode='run';overlay.classList.add('hidden')}else begin()};function pause(){if(mode==='run'){mode='paused';message.innerHTML='Your ocean sprint is paused.';start.textContent='RESUME';overlay.classList.remove('hidden')}else if(mode==='paused'){mode='run';overlay.classList.add('hidden')}}document.getElementById('pause').onclick=pause;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'♪ ON':'♪ OFF';beep()};function action(a){if(mode!=='run')return;if(a==='left')lane=Math.max(-1,lane-1);if(a==='right')lane=Math.min(1,lane+1);if(a==='jump'&&jump===0){slide=0;vy=7.8;beep(400)}if(a==='slide'&&jump===0)slide=.85}document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();action(b.dataset.action)}));window.addEventListener('keydown',e=>{const a={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',' ':'jump',w:'jump',ArrowDown:'slide',s:'slide'}[e.key];if(a){e.preventDefault();action(a)}if(e.key.toLowerCase()==='p')pause()});let touch=null;canvas.addEventListener('pointerdown',e=>{touch=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch[0],dy=e.clientY-touch[1];if(Math.max(Math.abs(dx),Math.abs(dy))>20)action(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide');else action('jump');touch=null});document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='run')pause()});function project(l,z){const p=1-Math.max(0,z)/135,q=p*p;return{x:W/2+l*(W*.265)*(q+.035),y:H*.29+q*H*.59,s:.12+q*1.12,p}}function round(x,y,w,h,r,fill,stroke='#614424'){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}function sponge(x,y,s){ctx.save();ctx.translate(x,y-jump*H*.11);ctx.scale(s,s);if(slide>0){ctx.rotate(-.28);ctx.scale(1,.56)}const run=mode==='run'?Math.sin(clock*16):Math.sin(clock*3)*.3;ctx.lineCap='round';ctx.lineWidth=7;ctx.strokeStyle='#ffe777';for(const side of[-1,1]){ctx.beginPath();ctx.moveTo(side*30,-44);ctx.lineTo(side*(45+run*4),-22);ctx.stroke();ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(side*14,-10);ctx.lineTo(side*14+run*side*8,8);ctx.stroke();round(side*14-11+run*side*8,5,24,11,5,'#382b43');ctx.strokeStyle='#ffe777'}round(-32,-83,64,60,12,'#ffe453');for(const p of[[-23,-70,5],[23,-76,4],[-23,-37,4],[21,-40,5],[0,-77,3]]){ctx.fillStyle='#d6ae35';ctx.beginPath();ctx.arc(...p,0,Math.PI*2);ctx.fill()}round(-31,-24,62,15,3,'#fafaff');round(-31,-10,62,13,3,'#d66b49');for(const e of[-12,12]){ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(e,-59,13,15,0,0,7);ctx.fill();ctx.fillStyle='#299ab9';ctx.beginPath();ctx.arc(e+2,-58,7,0,7);ctx.fill();ctx.fillStyle='#142b44';ctx.beginPath();ctx.arc(e+3,-57,3,0,7);ctx.fill()}ctx.strokeStyle='#6b401a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-49,17,.15,Math.PI-.15);ctx.stroke();round(-7,-41,14,8,2,'white',null);ctx.fillStyle='#fb946c';for(const x of[-23,23]){ctx.beginPath();ctx.arc(x,-48,5,0,7);ctx.fill()}if(shield>0){ctx.strokeStyle='#fff4a0';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,-38,51,66,0,0,7);ctx.stroke()}ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#087fa9');g.addColorStop(.45,'#5be4d8');g.addColorStop(1,'#e6c377');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff13';for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W*(.1+i*.24),0);ctx.lineTo(W*(i*.25-.2),H);ctx.lineTo(W*(i*.25+.2),H);ctx.closePath();ctx.fill()}for(let i=0;i<24;i++){const x=(i*83.9)%W,y=H-((clock*18+i*47)%H);ctx.strokeStyle='#cefff76b';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,3+(i%4)*2,0,7);ctx.stroke()}for(let i=0;i<9;i++){const x=i*W/8,y=H*.33+Math.sin(i*4)*H*.035;round(x-25,y-40,50,60,18,i%2?'#9175bd':'#67b9b1','#367e9780');ctx.fillStyle='#254d73';ctx.beginPath();ctx.arc(x,y-18,7,0,7);ctx.fill()}ctx.beginPath();ctx.moveTo(W*.45,H*.29);ctx.lineTo(W*.55,H*.29);ctx.lineTo(W*1.02,H);ctx.lineTo(-W*.02,H);ctx.closePath();ctx.fillStyle='#edcf89';ctx.fill();for(const l of[-.5,.5]){ctx.beginPath();for(let i=0;i<=30;i++){const a=project(l,i*4.5);i?ctx.lineTo(a.x,a.y):ctx.moveTo(a.x,a.y)}ctx.strokeStyle='#bd975b';ctx.lineWidth=3;ctx.stroke()}for(let i=0;i<14;i++){const z=(i*10+135-dist%10)%135,a=project(-1.45,z),b=project(1.45,z);ctx.strokeStyle='#fff0b14d';ctx.lineWidth=2*a.s;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();for(const p of[a,b]){ctx.fillStyle=i%2?'#ed789d':'#7a62b2';ctx.beginPath();ctx.ellipse(p.x,p.y,10*p.s,23*p.s,Math.sin(i),0,7);ctx.fill()}}const sorted=items.filter(o=>o.z>-8).sort((a,b)=>b.z-a.z);for(const o of sorted){const p=project(o.l,o.z);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);ctx.fillStyle='#5d492e33';ctx.beginPath();ctx.ellipse(0,3,32,8,0,0,7);ctx.fill();if(o.type==='coin'||o.type==='shield'||o.type==='magnet'){ctx.translate(0,-34+Math.sin(clock*5+o.z)*5);ctx.fillStyle=o.type==='coin'?'#ffd647':o.type==='shield'?'#adfff2':'#ff8bc9';ctx.strokeStyle='white';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#85502a';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(o.type==='coin'?'★':o.type==='shield'?'S':'M',0,6)}else if(o.type==='crate'){round(-30,-63,60,63,7,'#ba794e');ctx.strokeStyle='#77412e';ctx.beginPath();ctx.moveTo(-24,-56);ctx.lineTo(24,-7);ctx.moveTo(24,-56);ctx.lineTo(-24,-7);ctx.stroke()}else if(o.type==='coral'){for(let j=-1;j<=1;j++)round(j*18-8,-28-Math.abs(j)*8,16,34+Math.abs(j)*8,8,'#fc7786','#ad4464')}else{round(-42,-98,10,98,5,'#7975ba');round(32,-98,10,98,5,'#7975ba');round(-42,-98,84,54,17,'#ec83bc','#88469b');ctx.fillStyle='white';ctx.beginPath();ctx.arc(-13,-77,6,0,7);ctx.arc(13,-77,6,0,7);ctx.fill();ctx.fillStyle='#3a3159';ctx.beginPath();ctx.arc(-13,-77,3,0,7);ctx.arc(13,-77,3,0,7);ctx.fill()}ctx.restore()}const player=project(laneX,0);ctx.fillStyle='#65432342';ctx.beginPath();ctx.ellipse(player.x,player.y+6,35,11,0,0,7);ctx.fill();if(inv<=0||Math.floor(clock*12)%2===0)sponge(player.x,player.y,Math.min(W/440,1.25));for(const p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=Math.max(0,p.life);ctx.beginPath();ctx.arc(p.x,p.y,p.life*5,0,7);ctx.fill()}ctx.globalAlpha=1;stats.textContent=Math.floor(dist)+' m · 🪙 '+coins+' · '+'♥'.repeat(hp);}
function burst(x,y,color){for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*170,life:1,color})}function row(){const safe=Math.floor(Math.random()*3)-1;for(const l of[-1,0,1]){if(l!==safe&&Math.random()<.65)items.push({l,z:135,type:['crate','coral','gate'][Math.floor(Math.random()*3)]});else for(let i=0;i<3;i++)items.push({l,z:135+i*4,type:'coin'})}if(Math.random()<.17)items.push({l:safe,z:149,type:Math.random()<.5?'shield':'magnet'})}function finish(){mode='over';best=Math.max(best,Math.floor(dist));try{localStorage.setItem('spungGodsBest',best)}catch{}message.innerHTML='Run complete!<br><b>'+Math.floor(dist)+' meters · '+coins+' golden shells</b><br>Best run: '+best+' meters';start.textContent='RUN AGAIN';overlay.classList.remove('hidden');beep(180)}function update(dt){clock+=dt;if(mode!=='run')return;dist+=speed*dt;speed=Math.min(43,23+dist/450);laneX+=(lane-laneX)*(1-Math.exp(-13*dt));if(vy!==0||jump>0){jump+=vy*dt;vy-=20*dt;if(jump<=0){jump=vy=0}}slide=Math.max(0,slide-dt);shield=Math.max(0,shield-dt);magnet=Math.max(0,magnet-dt);inv=Math.max(0,inv-dt);toastTime-=dt;if(toastTime<=0)toast.textContent='';spawn-=dt;if(spawn<=0){row();spawn=2.0}for(const o of items){o.z-=speed*dt;if(o.hit)continue;if(o.z<3&&o.z>-4){const same=Math.abs(laneX-o.l)<.43;if(o.type==='coin'&&(same||magnet>0)){coins++;o.hit=true;const p=project(o.l,o.z);burst(p.x,p.y-35,'#ffea6d');beep(850)}else if(same&&(o.type==='shield'||o.type==='magnet')){o.hit=true;if(o.type==='shield')shield=10;else magnet=10;say(o.type==='shield'?'BUBBLE SHIELD!':'SHELL MAGNET!');beep(1100)}else if(same&&!['coin','shield','magnet'].includes(o.type)){if((o.type==='coral'&&jump>.48)||(o.type==='gate'&&slide>0)){o.hit=true;continue}o.hit=true;if(inv<=0){if(shield>0){shield=0;say('SHIELD SAVE!')}else{hp--;say(hp?'OUCH! SWITCH LANES!':'RUN COMPLETE')}inv=1.4;beep(150);burst(W/2,H*.8,'#ff8e84');if(hp<=0){finish();break}}}}}items=items.filter(o=>o.z>-12&&!o.hit);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=250*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}function frame(t){const dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
